<div id="admin-academics-view">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Academic Configuration</h2>
            <p class="text-muted">Manage departments, subjects, timetables, and sections.</p>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h5>Departments</h5>
                <div id="admin-departments-list" class="mt-3"></div>
                <button class="btn btn-outline-primary mt-3" onclick="showDepartmentForm()">Add Department</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h5>Subjects</h5>
                <div id="admin-subjects-list" class="mt-3"></div>
                <button class="btn btn-outline-primary mt-3" onclick="showSubjectForm()">Add Subject</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <h5>Sections</h5>
                <div id="admin-sections-list" class="mt-3"></div>
                <button class="btn btn-outline-primary mt-3" onclick="showSectionsForm()">Edit Sections</button>
            </div>
        </div>
    </div>

    <div class="card shadow-sm p-3 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h5>Timetables</h5>
                <p class="text-muted mb-0">Create or review timetable entries.</p>
            </div>
            <button class="btn btn-outline-primary" onclick="showTimetableForm()">Add Timetable</button>
        </div>
        <div id="admin-timetables-list"></div>
    </div>

    <div id="admin-academic-forms"></div>
</div>
