<div id="admin-attendance-view">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Attendance Administration</h2>
            <p class="text-muted">Review sessions and attendance metrics.</p>
        </div>
    </div>

    <div class="card shadow-sm p-3 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Search</label>
                <input id="admin-attendance-search" class="form-control" placeholder="Subject, department, section" />
            </div>
            <div class="col-md-2">
                <label class="form-label">Status</label>
                <select id="admin-attendance-status" class="form-select">
                    <option value="">All</option>
                    <option value="active">Active</option>
                    <option value="paused">Paused</option>
                    <option value="ended">Ended</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Department</label>
                <input id="admin-attendance-department" class="form-control" placeholder="Department" />
            </div>
            <div class="col-md-2">
                <label class="form-label">Date</label>
                <input id="admin-attendance-date" type="date" class="form-control" />
            </div>
            <div class="col-md-3 d-grid">
                <button class="btn btn-primary" onclick="loadAdminAttendance()">Filter Sessions</button>
            </div>
        </div>
    </div>

    <div id="admin-attendance-list"></div>
</div>
