<div id="teacher-attendance-history-view">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Attendance Management</h2>
            <p class="text-muted">Review session history and attendance records.</p>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Subject</label>
                    <input type="text" id="teacher-attendance-subject" class="form-control" placeholder="Subject">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Department</label>
                    <input type="text" id="teacher-attendance-department" class="form-control" placeholder="CSE">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Semester</label>
                    <input type="number" id="teacher-attendance-semester" class="form-control" min="1" max="8">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Section</label>
                    <input type="text" id="teacher-attendance-section" class="form-control" placeholder="A">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Date</label>
                    <input type="date" id="teacher-attendance-date" class="form-control">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="loadTeacherAttendanceHistory()">Go</button>
                </div>
            </div>
        </div>
    </div>

    <div id="teacher-attendance-history-list"></div>
</div>

<div class="modal fade" id="teacherAttendanceDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Session Attendance Records</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="teacher-attendance-detail-body"></div>
        </div>
    </div>
</div>
